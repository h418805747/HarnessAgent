<text x="84" y="364" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">服务（控制面）</text>
<text x="84" y="390" font-size="11.5" font-weight="400" fill="#5F6368" text-anchor="start">实例注册表 · 消息路由 · 唯一写库者（控制面唯一写入口）</text>
<text x="916" y="390" font-size="10.5" font-weight="400" fill="#8A8D91" text-anchor="end">信封 {worker_id, msg_id, seq, trace_id}</text>
<line x1="500" y1="416" x2="500" y2="452" stroke="#7D8187" stroke-width="1.6" marker-end="url(#ae)" marker-start="url(#as)"/>
<text x="514" y="440" font-size="10.5" font-weight="400" fill="#5F6368" text-anchor="start">run_turn(msg) ↓ · 事件回传 ↑（stdio JSON-RPC）</text>
