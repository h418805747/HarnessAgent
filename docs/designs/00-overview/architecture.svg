<text x="398.5" y="739" font-size="10.5" font-weight="400" fill="#8A8D91" text-anchor="middle">派生索引，可重建</text>
<rect x="508" y="678" width="187" height="72" rx="7" fill="#FFFFFF" stroke="#D8D9DC" stroke-width="1"/>
<text x="601.5" y="704" font-size="12.5" font-weight="700" fill="#1F2328" text-anchor="middle">Skills</text>
<text x="601.5" y="723" font-size="10.5" font-weight="400" fill="#5F6368" text-anchor="middle">元数据注入 · 按需加载</text>
<text x="601.5" y="739" font-size="10.5" font-weight="400" fill="#8A8D91" text-anchor="middle">SKILL.md 渐进披露</text>
<rect x="711" y="678" width="187" height="72" rx="7" fill="#FFFFFF" stroke="#D8D9DC" stroke-width="1"/>
<text x="804.5" y="704" font-size="12.5" font-weight="700" fill="#1F2328" text-anchor="middle">Tools</text>
<text x="804.5" y="723" font-size="10.5" font-weight="400" fill="#5F6368" text-anchor="middle">注册表 · Toolset · MCP</text>
<text x="804.5" y="739" font-size="10.5" font-weight="400" fill="#8A8D91" text-anchor="middle">沙箱编排</text>
<line x1="500" y1="776" x2="500" y2="812" stroke="#7D8187" stroke-width="1.6" marker-end="url(#ae)"/>
<text x="514" y="800" font-size="10.5" font-weight="400" fill="#5F6368" text-anchor="start">执行前 check() · 执行后审计 · 异常即拒绝</text>
<rect x="84" y="812" width="832" height="130" rx="8" fill="#FBF0EA" stroke="#E5C6B4" stroke-width="1"/>
<text x="102" y="838" font-size="13.5" font-weight="700" fill="#1F2328" text-anchor="start">③ 信任根 TCB · 常驻 · 不可卸载 · 不对模型暴露</text>
<text x="898" y="838" font-size="10" font-weight="400" fill="#8A8D91" text-anchor="end">fail-closed：缺失 / 异常 / 超时 → 拒绝</text>
<rect x="102" y="850" width="390" height="72" rx="7" fill="#FFFFFF" stroke="#D8D9DC" stroke-width="1"/>
