<text x="84" y="486" font-size="16" font-weight="700" fill="#1F2328" text-anchor="start">Agent worker（数据面）</text>
<text x="916" y="486" font-size="10.5" font-weight="400" fill="#8A8D91" text-anchor="end">Runtime → 能力 → TCB</text>
<rect x="84" y="500" width="832" height="106" rx="8" fill="#EDF4FC" stroke="#C2D8EF" stroke-width="1"/>
<text x="102" y="526" font-size="13.5" font-weight="700" fill="#1F2328" text-anchor="start">① Runtime 编排</text>
<text x="898" y="526" font-size="10" font-weight="400" fill="#8A8D91" text-anchor="end">只编排：不执行工具 / 不落盘 / 不判权限</text>
<rect x="102" y="538" width="238" height="56" rx="7" fill="#FFFFFF" stroke="#D8D9DC" stroke-width="1"/>
<text x="221" y="568" font-size="12.5" font-weight="700" fill="#1F2328" text-anchor="middle">Agent Loop</text>
<text x="221" y="587" font-size="10.5" font-weight="400" fill="#5F6368" text-anchor="middle">驱动 思考—行动—观察</text>
