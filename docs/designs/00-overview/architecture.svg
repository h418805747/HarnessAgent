<text x="1180" y="372" font-size="13.5" font-weight="700" fill="#1F2328" text-anchor="middle">共享 SQLite</text>
<text x="1180" y="392" font-size="10.5" font-weight="400" fill="#5F6368" text-anchor="middle">事件流 · 任务 · 记忆 · 审计</text>
