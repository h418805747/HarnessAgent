<text x="1180" y="584" font-size="10" font-weight="400" fill="#8A8D91" text-anchor="middle">OpenAI 兼容 / Anthropic / 本地</text>
<line x1="898" y1="566" x2="1030" y2="558" stroke="#7D8187" stroke-width="1.6" marker-end="url(#ae)"/>
<text x="985" y="548" font-size="9.5" font-weight="400" fill="#8A8D91" text-anchor="middle">HTTPS / SSE</text>
