<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1060" viewBox="0 0 1360 1060">
<title>HarnessAgent 架构总览</title>
<defs>
  <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,1 L9,5 L0,9 z" fill="#7D8187"/>
  </marker>
  <marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M10,1 L1,5 L10,9 z" fill="#7D8187"/>
  </marker>
</defs>
<rect x="0" y="0" width="1360" height="1060" fill="#FFFFFF"/>
<text x="60" y="54" font-size="20" font-weight="700" fill="#1F2328" text-anchor="start">HarnessAgent 架构总览</text>
<text x="60" y="78" font-size="11.5" font-weight="400" fill="#5F6368" text-anchor="start">自上而下：用户 → 壳 / 接入 → 服务 → Agent worker；Agent 内再分 Runtime / 能力 / TCB 三层</text>
<rect x="380" y="104" width="240" height="62" rx="10" fill="#EEF1FA" stroke="#C6D0EA" stroke-width="1"/>
<text x="500" y="130" font-size="15" font-weight="700" fill="#1F2328" text-anchor="middle">用户</text>
<text x="500" y="151" font-size="10.5" font-weight="400" fill="#5F6368" text-anchor="middle">对话 · 审批 · 工作空间操作</text>
<line x1="500" y1="166" x2="500" y2="204" stroke="#7D8187" stroke-width="1.6" marker-end="url(#ae)" marker-start="url(#as)"/>
<text x="514" y="193" font-size="10.5" font-weight="400" fill="#5F6368" text-anchor="start">输入 · 审批 · 输出（终端 / IM / 桌面）</text>
<rect x="60" y="204" width="880" height="96" rx="10" fill="#F6F6F4" stroke="#D2D2CE" stroke-width="1"/>
