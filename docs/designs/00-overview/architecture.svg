<text x="500" y="568" font-size="12.5" font-weight="700" fill="#1F2328" text-anchor="middle">Context Assembler</text>
<text x="500" y="587" font-size="10.5" font-weight="400" fill="#5F6368" text-anchor="middle">装配 Prompt · 预算裁剪</text>
<rect x="660" y="538" width="238" height="56" rx="7" fill="#FFFFFF" stroke="#D8D9DC" stroke-width="1"/>
<text x="779" y="568" font-size="12.5" font-weight="700" fill="#1F2328" text-anchor="middle">Model Adapter</text>
<text x="779" y="587" font-size="10.5" font-weight="400" fill="#5F6368" text-anchor="middle">多 Provider · 流式 token</text>
<line x1="340" y1="566" x2="381" y2="566" stroke="#7D8187" stroke-width="1.6" marker-end="url(#ae)"/>
<text x="360.5" y="558" font-size="9.5" font-weight="400" fill="#8A8D91" text-anchor="middle">装配</text>
<line x1="619" y1="566" x2="660" y2="566" stroke="#7D8187" stroke-width="1.6" marker-end="url(#ae)"/>
<text x="639.5" y="558" font-size="9.5" font-weight="400" fill="#8A8D91" text-anchor="middle">推理</text>
<line x1="500" y1="606" x2="500" y2="640" stroke="#7D8187" stroke-width="1.6" marker-end="url(#ae)"/>
<text x="514" y="628" font-size="10.5" font-weight="400" fill="#5F6368" text-anchor="start">装配上下文：历史 / 记忆 / 技能 / 工具 schema</text>
