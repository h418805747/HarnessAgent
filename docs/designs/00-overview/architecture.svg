<text x="102" y="666" font-size="13.5" font-weight="700" fill="#1F2328" text-anchor="start">② 能力组件（插件）</text>
<text x="898" y="666" font-size="10" font-weight="400" fill="#8A8D91" text-anchor="end">只经接口通信：IContextProvider / ISessionStore / IToolRegistry</text>
<rect x="102" y="678" width="187" height="72" rx="7" fill="#FFFFFF" stroke="#D8D9DC" stroke-width="1"/>
<text x="195.5" y="704" font-size="12.5" font-weight="700" fill="#1F2328" text-anchor="middle">Session</text>
<text x="195.5" y="723" font-size="10.5" font-weight="400" fill="#5F6368" text-anchor="middle">append-only 事件流</text>
<text x="195.5" y="739" font-size="10.5" font-weight="400" fill="#8A8D91" text-anchor="middle">唯一真相源</text>
<rect x="305" y="678" width="187" height="72" rx="7" fill="#FFFFFF" stroke="#D8D9DC" stroke-width="1"/>
