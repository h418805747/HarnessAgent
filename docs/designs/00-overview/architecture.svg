<text x="916" y="232" font-size="10.5" font-weight="400" fill="#8A8D91" text-anchor="end">统一 Message / Event 契约 · 不持有 worker_id</text>
<rect x="84" y="246" width="76" height="32" rx="7" fill="#FFFFFF" stroke="#D2D2CE" stroke-width="1"/>
<text x="122" y="266" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="middle">CLI REPL</text>
<rect x="170" y="246" width="43" height="32" rx="7" fill="#FFFFFF" stroke="#D2D2CE" stroke-width="1"/>
<text x="191.5" y="266" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="middle">TUI</text>
<rect x="223" y="246" width="63" height="32" rx="7" fill="#FFFFFF" stroke="#D2D2CE" stroke-width="1"/>
<text x="254.5" y="266" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="middle">Web UI</text>
<rect x="296" y="246" width="109" height="32" rx="7" fill="#FFFFFF" stroke="#D2D2CE" stroke-width="1"/>
<text x="350.5" y="266" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="middle">IDE (ACP/MCP)</text>
<rect x="415" y="246" width="89" height="32" rx="7" fill="#FFFFFF" stroke="#D2D2CE" stroke-width="1"/>
<text x="459.5" y="266" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="middle">IM Gateway</text>
<rect x="514" y="246" width="168" height="32" rx="7" fill="#FFFFFF" stroke="#D2D2CE" stroke-width="1"/>
<text x="598" y="266" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="middle">工作空间 UI（Electron）</text>
<rect x="692" y="246" width="115" height="32" rx="7" fill="#FFFFFF" stroke="#D2D2CE" stroke-width="1"/>
<text x="749.5" y="266" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="middle">SDK / Headless</text>
