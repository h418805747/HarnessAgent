<rect x="1030" y="746" width="300" height="56" rx="10" fill="#F2F2F0" stroke="#B9B9B6" stroke-width="1" stroke-dasharray="5 4"/>
<text x="1180" y="770" font-size="13.5" font-weight="700" fill="#1F2328" text-anchor="middle">执行后端</text>
<text x="1180" y="787" font-size="10" font-weight="400" fill="#8A8D91" text-anchor="middle">子进程 / Docker / SSH / 云沙箱</text>
