<text x="297" y="911" font-size="10.5" font-weight="400" fill="#8A8D91" text-anchor="middle">任何异常一律拒绝</text>
<rect x="508" y="850" width="390" height="72" rx="7" fill="#FFFFFF" stroke="#D8D9DC" stroke-width="1"/>
<text x="703" y="876" font-size="12.5" font-weight="700" fill="#1F2328" text-anchor="middle">Kernel</text>
