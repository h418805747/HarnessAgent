<text x="298" y="1018" font-size="10" font-weight="400" fill="#8A8D91" text-anchor="start">系统 / 信任边界</text>
<rect x="420" y="1005" width="40" height="18" rx="4" fill="#F2F2F0" stroke="#B9B9B6" stroke-width="1" stroke-dasharray="4 3"/>
<text x="468" y="1018" font-size="10" font-weight="400" fill="#8A8D91" text-anchor="start">外部系统 / 存储</text>
<text x="60" y="1042" font-size="10.5" font-weight="400" fill="#8A8D91" text-anchor="start">注：worker 不落盘，事件与 tool 调用经服务写入 SQLite；Memory 的嵌入 / 分词 / 向量召回经 Python 辅助进程（JSON-RPC）。</text>
